name: Build-Test
# Run this workflow every time a new commit pushed to your repository
on: push

jobs:
  # Set the job key. The key is displayed as the job name
  # when a job name is not provided
  build-test:
    # Name the Job
    name: Build and Unit Tests
    # Set the type of machine to run on
    runs-on: ubuntu-22.04

    defaults:
      run:
        shell: bash -l {0}

    steps:
      # Run package update
      - name: Update package lists
        run: |
          sudo apt update
          sudo apt dist-upgrade -y

      # Checks out a copy of your repository
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      # Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get install -y libgtest-dev libeigen3-dev cmake build-essential \
            libgflags-dev libunwind-dev libgoogle-glog-dev

      # Compiles the code
      - name: Run build
        run: make

      # Run tests
      - name: Run unit tests
        run: make test

      # Verify the library was built
      - name: Verify build artifacts
        run: |
          if [ ! -f "./build/libamrl_shared_lib.a" ]; then
            echo "Error: libamrl_shared_lib.a not found in build directory"
            exit 1
          fi
          if [ ! -f "./build/amrl_shared_lib_tests" ]; then
            echo "Error: amrl_shared_lib_tests not found in build directory"
            exit 1
          fi
          echo "✓ Build artifacts verified successfully"